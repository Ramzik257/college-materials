# Автопубликация после успешного CI на main (бонус ТЗ).
# Секреты в Settings → Secrets and variables → Actions:
#   FTP_HOST, FTP_USER, FTP_PASS, FTP_DIR
# Пока секретов нет — job пропускается (не ломает CI).

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check FTP secrets
        id: secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "FTP secrets not set — deploy skipped (нормально до настройки хостинга)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy files
        if: steps.secrets.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_DIR || '/htdocs/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/tests/**
            **/docs/**
            **/includes/config.php
            **/uploads/avatars/**
            **/.env
            **/README.md
